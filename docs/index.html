<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>వాస్తు దిక్సూచి</title>
<meta name="theme-color" content="#b2121f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* VOICE: a trusted elder's guide — calm, clear, no jargon.
   IDEA: a brass temple compass (diksuchi) on a kumkum-red cloth.
   PICTURE: the live compass rose, large, with the 8 directions in Telugu.
   COLOUR+TYPE: kumkum red ground, turmeric gold, white panels; Ramabhadra + Mandali.
   LAYOUT: phone app — top bar, one view at a time, bottom tab bar. */
@font-face{font-family:Mandali;src:url(fonts/mandali-telugu-400-normal.woff2) format("woff2");unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC;font-display:swap}
@font-face{font-family:Mandali;src:url(fonts/mandali-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:Ramabhadra;src:url(fonts/ramabhadra-telugu-400-normal.woff2) format("woff2");unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC;font-display:swap}
@font-face{font-family:Ramabhadra;src:url(fonts/ramabhadra-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
:root{color-scheme:light dark;
 --red:#b2121f;--red2:#8c0d18;--gold:#ffc72c;--gold2:#f2a900;
 --bg:light-dark(#fbf6ef,#160709);--card:light-dark(#ffffff,#26100f);--ink:light-dark(#2a1210,#f7e9e4);
 --mute:light-dark(#6f5751,#c8aaa3);--line:light-dark(#ecdcd3,#3d1f1d);
 --good:#1e8a4c;--ok:#c98a00;--bad:#c41d2a;--goodbg:light-dark(#e7f5ec,#10301e);--okbg:light-dark(#fff4d6,#3a2c08);--badbg:light-dark(#fde6e7,#3d1013)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Mandali,"Noto Sans Telugu",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.dname{font-family:Ramabhadra,"Noto Sans Telugu",system-ui,sans-serif;font-weight:400;margin:0;line-height:1.15}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{font-size:24px;flex:1}
header img{width:34px;height:34px;border-radius:8px}
.lang{background:var(--gold);color:#3a1a00;border:0;border-radius:22px;padding:8px 14px;font:inherit;font-size:15px;min-height:40px;cursor:pointer}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
section{display:none}section.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;padding:8px 4px 10px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--red)}nav button.on svg{stroke:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-size:17px;min-height:48px;cursor:pointer}
.btn.alt{background:transparent;color:var(--red);border:2px solid var(--red)}
.btn.gold{background:var(--gold);color:#3a1a00}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px}
.btn:focus-visible,.chip:focus-visible,nav button:focus-visible,.lang:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mute{color:var(--mute);font-size:15px}
.dial{position:relative;width:min(86vw,360px);aspect-ratio:1;margin:4px auto 10px}
.dial svg{width:100%;height:100%;display:block}
#rose{transition:transform .12s linear}
@media (prefers-reduced-motion:reduce){#rose{transition:none}}
.reading{text-align:center}
.dname{font-size:40px;color:var(--red)}
.deg{font-size:20px;color:var(--mute)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.facts b{font-weight:400;color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 2px;font:inherit;font-size:14px;min-height:44px;cursor:pointer}
.chip.sel{background:var(--red);border-color:var(--red);color:#fff}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:0;padding-top:0}
.item h3{font-size:19px;margin-bottom:6px}
.res{border-radius:10px;padding:8px 12px;margin-top:8px;font-size:16px}
.res.good{background:var(--goodbg);color:var(--good)}.res.ok{background:var(--okbg);color:var(--ok)}.res.bad{background:var(--badbg);color:var(--bad)}
.res.good,.res.ok,.res.bad{font-weight:400}
.yn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.verdict{border-radius:16px;padding:18px;color:#fff;margin-bottom:14px}
.verdict h2{font-size:28px}
.verdict.good{background:var(--good)}.verdict.ok{background:#b07800}.verdict.bad{background:var(--bad)}
.meter{height:10px;background:rgba(255,255,255,.3);border-radius:6px;margin-top:10px;overflow:hidden}.meter i{display:block;height:100%;background:#fff}
ul.list{margin:6px 0 0;padding-left:20px}ul.list li{margin:4px 0}
input[type=text],input[type=range]{width:100%;font:inherit;font-size:16px}
input[type=text]{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.mini{width:84px;height:84px;flex:none}
.rcard{display:flex;gap:14px;align-items:flex-start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-bottom:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.tag{display:inline-block;background:var(--gold);color:#3a1a00;border-radius:8px;padding:0 8px;font-size:14px;margin-left:6px}
.saved{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a1210;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.hint{font-size:15px;background:var(--okbg);border-radius:12px;padding:10px 12px;margin:10px 0}
</style>
</head>
<body>
<header>
 <img src="icon-192.png" alt="">
 <h1 data-k="app">వాస్తు దిక్సూచి</h1>
 <button class="lang" id="lang" aria-label="Language">English</button>
</header>

<main>
<!-- COMPASS -->
<section id="v-compass" class="on">
 <div class="dial"><svg viewBox="0 0 300 300" id="dial" role="img" aria-label="compass"></svg></div>
 <div class="reading">
  <div class="dname" id="dname">—</div>
  <div class="deg" id="deg" aria-live="polite"></div>
 </div>
 <div class="row" style="justify-content:center;margin:14px 0">
  <button class="btn" id="start" data-k="start">దిక్సూచి ప్రారంభించండి</button>
  <button class="btn alt" id="hold" hidden data-k="hold">ఈ దిశను నిలుపు</button>
 </div>
 <div class="card" id="manualBox" hidden>
  <div class="mute" id="manualMsg" data-k="manual"></div>
  <input type="range" id="manual" min="0" max="359" value="0" aria-label="heading">
 </div>
 <div class="card" id="dirInfo"></div>
 <p class="mute" data-k="calib"></p>
</section>

<!-- HOUSE CHECK -->
<section id="v-check">
 <div id="checkForm">
  <h2 style="font-size:26px;margin-bottom:6px" data-k="checkTitle"></h2>
  <p class="mute" data-k="checkIntro"></p>
  <div class="card">
   <label for="hname" class="mute" data-k="hname"></label>
   <input type="text" id="hname" autocomplete="off">
  </div>
  <div class="card">
   <h3 style="font-size:21px"><span data-k="step1"></span></h3>
   <p class="mute" data-k="doorHow"></p>
   <div class="row" style="margin-bottom:8px"><span class="tag" id="liveTag"></span></div>
   <div id="facingBox"></div>
  </div>
  <div class="card">
   <h3 style="font-size:21px" data-k="step2"></h3>
   <p class="mute" data-k="roomHow"></p>
   <div id="roomsBox"></div>
  </div>
  <div class="card">
   <h3 style="font-size:21px" data-k="step3"></h3>
   <div id="qBox"></div>
  </div>
  <div class="row" style="margin-bottom:20px">
   <button class="btn" id="seeResult" data-k="seeResult"></button>
   <button class="btn alt" id="reset" data-k="reset"></button>
  </div>
  <div class="card" id="savedBox"></div>
 </div>
 <div id="report" hidden></div>
</section>

<!-- ROOMS GUIDE -->
<section id="v-rooms">
 <h2 style="font-size:26px;margin-bottom:8px" data-k="roomsTitle"></h2>
 <div class="legend"><span style="--c:var(--good)" data-k="lgBest"></span><span style="--c:var(--gold2)" data-k="lgOk"></span><span style="--c:var(--bad)" data-k="lgAvoid"></span></div>
 <div id="roomsGuide"></div>
</section>

<!-- DIRECTIONS -->
<section id="v-dirs">
 <h2 style="font-size:26px;margin-bottom:8px" data-k="dirsTitle"></h2>
 <div class="dgrid" id="dirsGrid"></div>
</section>
<p class="mute" style="margin-top:18px" data-k="disclaimer"></p>
</main>

<nav>
 <button data-v="compass" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span data-k="tCompass"></span></button>
 <button data-v="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-k="tCheck"></span></button>
 <button data-v="rooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg><span data-k="tRooms"></span></button>
 <button data-v="dirs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg><span data-k="tDirs"></span></button>
</nav>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
