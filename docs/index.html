<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>వాస్తు దిక్సూచి</title>
<meta name="theme-color" content="#9e0f1b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Mandali;src:url(fonts/mandali-telugu-400-normal.woff2) format("woff2");unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC;font-display:swap}
@font-face{font-family:Mandali;src:url(fonts/mandali-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
@font-face{font-family:Ramabhadra;src:url(fonts/ramabhadra-telugu-400-normal.woff2) format("woff2");unicode-range:U+0951-0952,U+0964-0965,U+0C00-0C7F,U+1CDA,U+1CF2,U+200C-200D,U+25CC;font-display:swap}
@font-face{font-family:Ramabhadra;src:url(fonts/ramabhadra-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;font-display:swap}
:root{color-scheme:light;
 --red:#9e0f1b;--red2:#c4202e;--gold:#ffc72c;--gold2:#e8a200;--goldbg:#fff3cf;
 --bg:#f7f1ea;--card:#fff;--ink:#2a1210;--mute:#76605a;--line:#eadbd1;--soft:#fbf7f3;
 --good:#17804a;--ok:#b87b00;--bad:#c0202c;--goodbg:#e4f4ea;--okbg:#fff2d2;--badbg:#fde4e5;
 --r:18px;--sh:0 1px 2px rgba(60,20,10,.06),0 6px 18px rgba(60,20,10,.06)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
/* no selecting / copying text anywhere except form fields */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg,video,canvas{-webkit-user-drag:none;user-drag:none}
body{background:var(--bg);color:var(--ink);font:16.5px/1.55 Mandali,"Noto Sans Telugu",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3,h4,.disp{font-family:Ramabhadra,"Noto Sans Telugu",system-ui,sans-serif;font-weight:400;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;min-height:56px}
.top h1{font-size:21px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .logo{width:32px;height:32px;border-radius:9px;background:#fff1}
.ib{background:none;border:0;color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib svg{width:24px;height:24px}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:20px;padding:3px}
.seg button{background:none;border:0;color:#fff;border-radius:17px;padding:4px 11px;font-size:14px;min-height:34px}
.seg button.on{background:var(--gold);color:#3a1a00}
.qpill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px 3px 8px;font-size:13px;background:rgba(255,255,255,.16);color:#fff;border:0;min-height:30px}
.qpill i,.qdot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block;flex:none}
.q-good{background:#2fcf74!important}.q-medium{background:#ffc72c!important}.q-low,.q-interf{background:#ff5a5a!important}
main{padding:14px 14px calc(88px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
section{display:none}section.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(60,20,10,.06)}
nav.tabs button{background:none;border:0;color:var(--mute);font-size:12.5px;padding:7px 2px 8px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--red)}
nav.tabs button.on .pip{background:var(--goldbg)}
.pip{border-radius:14px;padding:2px 14px;display:grid;place-items:center}
/* cards & buttons */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.card h3{font-size:19px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:16.5px;min-height:50px}
.btn svg{width:22px;height:22px;flex:none}
.btn.alt{background:var(--card);color:var(--red);border:2px solid var(--red)}
.btn.gold{background:var(--gold);color:#3a1a00}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;padding:7px 12px;font-size:14.5px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.btn:active,.tile:active,.chip:active{transform:scale(.98)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mute{color:var(--mute);font-size:14.5px}
.small{font-size:13.5px}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
/* home */
.hero{background:linear-gradient(145deg,#9e0f1b,#c4202e 60%,#e04b2c);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(158,15,27,.25)}
.hero h2{font-size:24px;margin:2px 0 6px}
.hero p{margin:0 0 14px;opacity:.92;font-size:15px}
.hero .deco{position:absolute;right:-30px;top:-30px;width:170px;opacity:.16}
.hero .btn{background:var(--gold);color:#3a1a00;width:100%}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14.5px;box-shadow:var(--sh)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--goldbg);display:grid;place-items:center;color:var(--red)}
.tile .ic svg{width:26px;height:26px}
.wide-tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.wide-tile .ic{width:52px;height:52px;border-radius:16px;background:var(--goldbg);color:var(--red);display:grid;place-items:center;flex:none}
.wide-tile .ic svg{width:30px;height:30px}
.wide-tile h3{font-size:18px;margin:0}
.chev{margin-left:auto;color:var(--mute);flex:none}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 10px}
.sec-h h2{font-size:20px}
/* compass */
.dialwrap{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:6px auto 4px}
.dialwrap svg{width:100%;height:100%;display:block;overflow:visible}
.read{text-align:center;margin:2px 0 8px}
.read .dn{font-family:Ramabhadra,sans-serif;font-size:38px;color:var(--red);line-height:1.1}
.read .dg{font-size:20px;color:var(--mute);font-variant-numeric:tabular-nums}
.status{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13.5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15.5px}
.facts b{font-weight:400;color:var(--mute)}
/* wizard */
.flow{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.flow .top{position:relative}
.flow .body{flex:1;overflow-y:auto;padding:14px 14px 20px;max-width:760px;width:100%;margin:0 auto}
.flow .foot{background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:760px;width:100%;margin:0 auto}
.flow .foot.one{grid-template-columns:1fr}
.prog{height:5px;background:rgba(255,255,255,.25)}.prog i{display:block;height:100%;background:var(--gold);transition:width .25s}
.stage{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;scrollbar-width:none;max-width:760px;margin:0 auto;width:100%}
.stage span{flex:none;font-size:12.5px;border-radius:20px;padding:3px 10px;background:var(--card);border:1px solid var(--line);color:var(--mute)}
.stage span.on{background:var(--red);border-color:var(--red);color:#fff}
.stage span.done{background:var(--goodbg);border-color:#bfe3cc;color:var(--good)}
.qt{font-size:23px;margin:4px 0 6px}
.how{font-size:15px;color:var(--mute);margin:0 0 12px}
.live{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 12px;box-shadow:var(--sh)}
.live svg{width:64px;height:64px;flex:none}
.live .dn{font-family:Ramabhadra,sans-serif;font-size:27px;line-height:1.1}
.live .dg{color:var(--mute);font-variant-numeric:tabular-nums}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.toggle button{border:0;background:none;border-radius:11px;padding:8px 6px;font-size:14px;min-height:44px;color:var(--mute)}
.toggle button.on{background:var(--red);color:#fff}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:6px auto 4px}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:54px;font-size:15px;padding:4px}
.pick button.sel{background:var(--red);border-color:var(--red);color:#fff}
.pick .ctr{background:none;border:0;display:grid;place-items:center;color:var(--mute);font-size:12px}
.res{border-radius:14px;padding:10px 13px;margin-top:12px;font-size:15.5px}
.res.good{background:var(--goodbg);color:#0f5e35}.res.ok{background:var(--okbg);color:#6e4a00}.res.bad{background:var(--badbg);color:#8f1520}
.thumbrow{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.thumbrow img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:2px solid var(--card);box-shadow:var(--sh);flex:none}
.yn{display:grid;gap:10px;margin-top:16px}
.yn button{min-height:58px;font-size:18px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.yn button.sel{background:var(--red);color:#fff;border-color:var(--red)}
label.f{display:block;font-size:14.5px;color:var(--mute);margin:12px 0 5px}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.rasis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.rasis button{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:46px;font-size:14px;padding:4px}
.rasis button.sel{background:var(--red);color:#fff;border-color:var(--red)}
.detect{display:flex;gap:12px;align-items:center;background:var(--goldbg);border-radius:14px;padding:10px 12px;margin-top:10px}
.detect .syl{font-family:Ramabhadra,sans-serif;font-size:30px;color:var(--red);min-width:46px;text-align:center}
/* charts */
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:14.5px}
.bar .tr{height:14px;background:var(--soft);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.bar.me{font-weight:700}.bar.me .lab::after{content:" ●";color:var(--gold2)}
.verdict{border-radius:22px;padding:16px;color:#fff;margin-bottom:14px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh)}
.verdict.good{background:linear-gradient(140deg,#13703f,#1f9a58)}.verdict.ok{background:linear-gradient(140deg,#9a6400,#c98a00)}.verdict.bad{background:linear-gradient(140deg,#9e0f1b,#d22c38)}
.verdict h2{font-size:23px;margin-bottom:4px}
.verdict svg{width:110px;flex:none}
.zone{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);border:4px solid #7a5a50;border-radius:6px;position:relative;margin:26px 26px 26px}
.zone>div{background:var(--card);min-height:84px;padding:5px;font-size:12.5px;line-height:1.3;display:flex;flex-direction:column;gap:3px}
.zone .zl{font-size:11.5px;color:var(--mute)}
.zone .rm{border-radius:6px;padding:1px 5px}
.zone .rm.good{background:var(--goodbg);color:#0f5e35}.zone .rm.ok{background:var(--okbg);color:#6e4a00}.zone .rm.bad{background:var(--badbg);color:#8f1520}.zone .rm.neutral{background:var(--soft)}
.zone .c{background:#fffaf0}
.road{position:absolute;z-index:2;background:#5d5d5d;color:#fff;font-size:10.5px;display:grid;place-items:center;letter-spacing:.5px}
.road.N{left:0;right:0;top:-24px;height:16px}.road.S{left:0;right:0;bottom:-24px;height:16px}
.road.E{top:0;bottom:0;right:-24px;width:16px;writing-mode:vertical-rl}.road.W{top:0;bottom:0;left:-24px;width:16px;writing-mode:vertical-rl}
.door{position:absolute;z-index:3;display:block;box-shadow:0 0 0 2px #fff;width:30px;height:8px;background:var(--gold2);border-radius:3px}
.list{margin:4px 0 0;padding-left:20px}.list li{margin:5px 0}
.tag{display:inline-block;border-radius:7px;padding:0 7px;font-size:12.5px;margin-left:6px;vertical-align:1px}
.tag.bad{background:var(--bad);color:#fff}.tag.good{background:var(--good);color:#fff}.tag.ok{background:var(--gold);color:#3a1a00}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}.kv b{font-weight:400;color:var(--mute)}
.brief{font-size:16px;background:var(--goldbg);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.saved{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.saved:first-child{border-top:0}
.saved .sc{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.saved .nm{flex:1}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal button{border:0;padding:0;background:none;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;border-radius:6px;padding:0 5px}
.gtabs{display:flex;gap:8px;margin-bottom:12px}
.gtabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px}
.gtabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:78px;height:78px;flex:none}
.mini i{border-radius:3px;background:var(--soft);font-size:9px;display:grid;place-items:center;font-style:normal;color:var(--mute)}
.mini i.good{background:var(--good);color:#fff}.mini i.ok{background:var(--gold);color:#3a1a00}.mini i.bad{background:var(--bad);color:#fff}
.rcard{display:flex;gap:14px;align-items:flex-start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin-bottom:10px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;background:var(--c)}
/* camera */
.cam{position:fixed;inset:0;z-index:50;background:#000;color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .ctop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) calc(min(30vw,128px) + 22px) 30px 10px;display:flex;align-items:flex-start;gap:8px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.cam .ib{background:rgba(0,0,0,.35)}
.cam .clab{background:rgba(0,0,0,.45);border-radius:12px;padding:6px 10px;font-size:14px;margin-top:4px}
.camrose{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 8px);width:min(30vw,128px)}
.camrose svg{width:100%;display:block}
.camrose .cd{text-align:center;font-family:Ramabhadra,sans-serif;font-size:15px;text-shadow:0 1px 3px #000;margin-top:2px}
.aim{position:absolute;left:50%;top:22%;bottom:30%;width:2px;background:rgba(255,199,44,.85);transform:translateX(-50%)}
.aim::before{content:"";position:absolute;left:-7px;top:-6px;border:8px solid transparent;border-bottom:12px solid rgba(255,199,44,.95);border-top:0}
.cam .cbot{position:absolute;left:0;right:0;bottom:0;padding:30px 0 calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.7))}
.labs{display:flex;gap:8px;overflow-x:auto;padding:0 12px 14px;scrollbar-width:none}
.labs button{flex:none;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;border-radius:18px;padding:5px 12px;font-size:14px;min-height:36px}
.labs button.on{background:var(--gold);color:#3a1a00;border-color:var(--gold)}
.shut{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--red2);box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.shutter:active{transform:scale(.94)}
.lastimg{width:54px;height:54px;border-radius:12px;border:2px solid #fff;object-fit:cover;background:#222}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.8;transition:none}
.camerr{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.viewer img{flex:1;object-fit:contain;width:100%;min-height:0}
.viewer .vb{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));justify-content:center;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;z-index:70;background:rgba(30,8,8,.72);display:grid;place-items:center;padding:20px}
.modal .card{max-width:380px;width:100%;text-align:center;margin:0}
.modal .btn{width:100%;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a1210;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hint{font-size:14.5px;background:var(--okbg);border-radius:14px;padding:10px 12px;margin:10px 0}
.empty{text-align:center;padding:24px 10px;color:var(--mute)}
</style>
</head>
<body>
<div class="top" id="mainTop">
 <img class="logo" src="icon-192.png" alt="">
 <h1 data-k="app">వాస్తు దిక్సూచి</h1>
 <button class="qpill" id="qpill" data-act="calib"><i id="qdot"></i><span id="qtxt"></span></button>
 <div class="seg" role="group" aria-label="Language"><button data-lang="te">తె</button><button data-lang="en">EN</button></div>
</div>

<main>
<section id="v-home" class="on"></section>
<section id="v-compass"></section>
<section id="v-photos"></section>
<section id="v-reports"></section>
<section id="v-guide"></section>
